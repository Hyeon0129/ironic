  <script>
  
    const VALID_ID = 'nogada';
    const VALID_PASSWORD = 'rhaqkd@123';
    const REDIRECT_URL = 'dashboard'; 
    const LOGIN_DURATION_MS = 9 * 60 * 60 * 1000; // 9시간

    const idInput = document.getElementById('login-id');
    const pwInput = document.getElementById('login-password');
    const errorBox = document.getElementById('login-error');

    const isLoggedIn = () => {
      const exp = parseInt(localStorage.getItem('login_expires_at') || '0', 10);
      return Boolean(exp) && Date.now() < exp;
    };

    if (isLoggedIn()) {
      window.location.replace(REDIRECT_URL);
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      idInput.classList.remove('invalid');
      pwInput.classList.remove('invalid');

      const id = idInput.value.trim();
      const pw = pwInput.value;

      const ok = id === VALID_ID && pw === VALID_PASSWORD;
      if (!ok) {
        errorBox.textContent = 'ID 또는 비밀번호가 올바르지 않습니다.';
        idInput.classList.add('invalid');
        pwInput.classList.add('invalid');
        pwInput.focus();
        return;
      }

      localStorage.setItem('login_user', id);
      localStorage.setItem('login_expires_at', String(Date.now() + LOGIN_DURATION_MS));

      window.location.href = REDIRECT_URL;
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        document.body.classList.add('keyboard-navigation');
      }
    });

    document.addEventListener('mousedown', () => {
      document.body.classList.remove('keyboard-navigation');
    });
  </script>
